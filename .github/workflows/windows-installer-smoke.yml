name: Windows installer smoke checks

on:
  pull_request:
    paths:
      - "setup.ps1"
      - "install.ps1"
      - ".github/workflows/windows-installer-smoke.yml"
  push:
    branches: [main]
    paths:
      - "setup.ps1"
      - "install.ps1"
      - ".github/workflows/windows-installer-smoke.yml"

jobs:
  powershell-parse-and-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer scripts and enforce ASCII contract
        shell: pwsh
        run: |
          $files = @("setup.ps1", "install.ps1")
          foreach ($file in $files) {
            $path = (Resolve-Path $file).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path, [ref]$tokens, [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error ($file + ":" + $_.Extent.StartLineNumber + ": " + $_.Message) }
              throw "PowerShell parsing failed for $file"
            }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if (($bytes | Where-Object { $_ -gt 127 }).Count -gt 0) {
              throw "$file must remain 7-bit ASCII for Windows PowerShell 5.1 compatibility"
            }
            Write-Host "PASS: $file parses and remains ASCII"
          }

          $setup = Get-Content "setup.ps1" -Raw
          foreach ($required in @(
            "function Test-PostgresServerReady",
            "ForEach-Object",
            "Write-Host",
            "--skip-scan",
            "Initial repository analysis failed",
            "Garuda API did not become healthy"
          )) {
            if (-not $setup.Contains($required)) {
              throw "setup.ps1 is missing required installer contract: $required"
            }
          }

          $installer = Get-Content "install.ps1" -Raw
          foreach ($required in @(
            "status --porcelain --untracked-files=no",
            "Local commits exist",
            "Garuda setup failed with exit code"
          )) {
            if (-not $installer.Contains($required)) {
              throw "install.ps1 is missing required update-safety contract: $required"
            }
          }
          Write-Host "PASS: Windows installer reliability contracts are present"
