name: AI README Updater

on:
  workflow_dispatch:  # Allows manual trigger

# Grant write access to push README changes
permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install google-generativeai pyyaml
      
      - name: Run AI README updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          chmod +x scripts/update_readme_ai.py
          python scripts/update_readme_ai.py || echo "Script failed, continuing..."
      
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then echo "no README changes"; exit 0; fi
          git checkout -B bot/ai-readme
          git commit -m "🤖 Auto-update README from AI [skip ci]"
          git push --force origin bot/ai-readme
          gh pr create --base main --head bot/ai-readme --title "🤖 Auto-update README" --body "Generated by the AI README workflow. Review before merging." || echo "PR already open"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}