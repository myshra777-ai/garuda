name: Garuda CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: garuda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.56.2
          args: --timeout=5m

      - name: Run Go Unit Tests
        env:
          POSTGRES_URL: "postgres://postgres:test@localhost:5432/garuda_test?sslmode=disable"
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Build Binaries
        run: |
          mkdir -p bin
          go build -o bin/garuda ./cmd/garuda
          go build -o bin/garuda-api ./cmd/garuda-api
          go build -o bin/garuda-worker ./cmd/garuda-worker