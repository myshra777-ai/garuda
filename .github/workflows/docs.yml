name: Auto-Generate Documentation

on:
  workflow_dispatch:      # Manual trigger from GitHub UI
  schedule:
    - cron: '0 0 * * 1'  # Weekly run on Monday
  # Removed push trigger to prevent branch desynchronization during active development

permissions:
  contents: write

jobs:
  generate-docs:
    name: Generate & Verify Documentation Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go Runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build Garuda Engine
        run: |
          go build -o garuda cmd/garuda/*.go
          chmod +x garuda

      - name: Pre-create Documentation Directories
        run: |
          mkdir -p docs/generated docs/source

      - name: Run AST Semantic Analysis
        env:
          GARUDA_TENANT_ID: "00000000-0000-0000-0000-000000000001"
        run: |
          ./garuda analyze . -o garuda-snapshot.json

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          else
            pip install pyyaml requests
          fi

      - name: Generate Capabilities Matrix
        run: |
          python scripts/generate_capabilities.py \
            --capabilities docs/source/capabilities.yaml \
            --snapshot garuda-snapshot.json \
            --output docs/CAPABILITIES.md

      - name: Build Documentation Context
        if: hashFiles('scripts/build_docs_context.py') != ''
        run: |
          python scripts/build_docs_context.py \
            --snapshot garuda-snapshot.json \
            --product docs/source/product.yaml \
            --capabilities docs/source/capabilities.yaml \
            --roadmap docs/source/roadmap.yaml \
            --output docs/generated/docs-context.json

      - name: Generate CHANGELOG (AI Engine)
        if: env.GEMINI_API_KEY != '' && hashFiles('scripts/generate_changelog.py') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_SECONDARY }}
        run: |
          python scripts/generate_changelog.py \
            --context docs/generated/docs-context.json \
            --output CHANGELOG.md

      - name: Generate API Documentation (AI Engine)
        if: env.GEMINI_API_KEY != '' && hashFiles('scripts/generate_api_docs.py') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TERTIARY }}
        run: |
          python scripts/generate_api_docs.py \
            --context docs/generated/docs-context.json \
            --output docs/API.md

      - name: Validate Generated Documentation
        if: hashFiles('scripts/validate_docs.py') != ''
        run: |
          python scripts/validate_docs.py \
            --context docs/generated/docs-context.json

      - name: Atomic Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/CAPABILITIES.md docs/API.md CHANGELOG.md docs/generated/
          if git diff --staged --quiet; then
            echo "No documentation changes detected. Skipping push."
          else
            git commit -m "docs: auto-generate capabilities matrix and API specs [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi