name: Documentation Draft & Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

# Generated docs are review artifacts only. Canonical product docs are never
# committed by this workflow without a human-reviewed pull request.
permissions:
  contents: read

jobs:
  generate-docs:
    name: Build documentation drafts from current source metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: true

      - name: Build Garuda CLI
        run: |
          mkdir -p bin docs/generated
          go build -o bin/garuda ./cmd/garuda

      - name: Export source snapshot
        env:
          GARUDA_TENANT_ID: "00000000-0000-0000-0000-000000000001"
        run: |
          ./bin/garuda analyze . --output docs/generated/garuda-snapshot.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scripts/requirements.txt ]; then
            pip install -r scripts/requirements.txt
          else
            pip install pyyaml requests
          fi

      - name: Test documentation context schema compatibility
        run: python scripts/test_build_docs_context.py

      - name: Generate capabilities draft
        run: |
          python scripts/generate_capabilities.py \
            --capabilities docs/source/capabilities.yaml \
            --snapshot docs/generated/garuda-snapshot.json \
            --output docs/generated/CAPABILITIES.draft.md

      - name: Build documentation context
        run: |
          python scripts/build_docs_context.py \
            --snapshot docs/generated/garuda-snapshot.json \
            --product docs/source/product.yaml \
            --capabilities docs/source/capabilities.yaml \
            --roadmap docs/source/roadmap.yaml \
            --output docs/generated/docs-context.json

      - name: Validate documentation context
        if: hashFiles('scripts/validate_docs.py') != ''
        run: |
          python scripts/validate_docs.py --context docs/generated/docs-context.json

      - name: Upload review artifacts (no direct commits)
        uses: actions/upload-artifact@v4
        with:
          name: garuda-documentation-drafts
          path: |
            docs/generated/CAPABILITIES.draft.md
            docs/generated/docs-context.json
            docs/generated/garuda-snapshot.json
          if-no-files-found: error
          retention-days: 14
