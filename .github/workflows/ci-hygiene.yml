name: CI Hygiene (migrations + repo)

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: garuda_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d garuda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cold boot + idempotent re-run of every migration (no masking)
        run: scripts/check_migrations.sh "postgres://test:test@localhost:5433/garuda_test?sslmode=disable"

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No tracked binaries or oversized files
        run: scripts/check_repo_hygiene.sh 2048

  docs-and-manifests:
    name: Docs, counts, links and marketplace manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version, counts and living docs agree with capabilities.json
        run: python3 scripts/sync_docs_from_manifest.py --check
      - name: Relative Markdown links resolve
        run: python3 scripts/check_doc_links.py
      - name: JSON and YAML files parse (manifests, workflows, OpenAPI)
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_data_files.py
      - name: Marketplace and MCP-registry files are tracked, visible and consistent
        run: python3 scripts/check_marketplace_manifests.py
      - name: No tracked file is also git-ignored
        run: |
          bad="$(git ls-files -ci --exclude-standard)"
          if [ -n "$bad" ]; then echo "Tracked but ignored (fix .gitignore):"; echo "$bad"; exit 1; fi

  go-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./cmd/garuda ./cmd/garuda-api ./internal/api ./internal/policy ./internal/store
