name: AI Documentation Draft

on:
  workflow_dispatch:

# AI-generated text is a draft and must be reviewed before it changes canonical docs.
permissions:
  contents: read

jobs:
  draft-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install google-generativeai pyyaml
      - name: Generate docs draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ ! -f scripts/update_docs_ai.py ]; then
            echo "No AI docs generator is present in this revision."
            exit 0
          fi
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "GEMINI_API_KEY is required for this manual draft workflow."
            exit 1
          fi
          python scripts/update_docs_ai.py
      - name: Package draft and diff for review
        run: |
          mkdir -p docs/generated
          git diff --binary -- docs > docs/generated/ai-docs.patch
          git status --short -- docs > docs/generated/ai-docs-status.txt
      - name: Upload AI docs for review
        uses: actions/upload-artifact@v4
        with:
          name: garuda-ai-docs-draft
          path: |
            docs/
          if-no-files-found: error
          retention-days: 14
