name: AI Documentation Generator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install google-generativeai pyyaml
      
      - name: Generate Changelog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_changelog.py || echo "Changelog generation skipped"
      
      - name: Generate API Docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_api_docs.py || echo "API docs generation skipped"
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md docs/API.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🤖 Auto-update docs from AI [skip ci]"
          git push