name: AI Documentation Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-generativeai pyyaml

      - name: Generate AI Docs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -f "scripts/update_docs_ai.py" ]; then
            python scripts/update_docs_ai.py || echo "Docs generator failed, continuing..."
          fi

      - name: Commit and push docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ || true
          if git diff --staged --quiet; then echo "no docs changes"; exit 0; fi
          git checkout -B bot/ai-docs
          git commit -m "docs: auto-update architectural documentation [skip ci]"
          git push --force origin bot/ai-docs
          gh pr create --base main --head bot/ai-docs --title "docs: auto-update architectural documentation" --body "Generated by the AI docs workflow. Review before merging." || echo "PR already open"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}