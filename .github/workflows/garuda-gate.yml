name: Garuda Knowledge Integrity Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  verify-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: garuda
          POSTGRES_PASSWORD: garudapassword
          POSTGRES_DB: garuda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://garuda:garudapassword@localhost:5432/garuda?sslmode=disable
        run: |
          psql $DATABASE_URL -f migrations/059_document_claims.sql

      - name: Build Garuda Engine CLI
        run: go build -o bin/garuda ./cmd/garuda

      - name: Ingest Architecture Documentation & ADRs
        env:
          DATABASE_URL: postgres://garuda:garudapassword@localhost:5432/garuda?sslmode=disable
        run: ./bin/garuda docs ingest docs/adr/

      - name: Analyze Codebase AST
        env:
          DATABASE_URL: postgres://garuda:garudapassword@localhost:5432/garuda?sslmode=disable
        run: ./bin/garuda analyze .

      - name: Run Garuda Knowledge Integrity Gate
        env:
          DATABASE_URL: postgres://garuda:garudapassword@localhost:5432/garuda?sslmode=disable
        run: ./bin/garuda ci check --fail-on-contradiction=true
