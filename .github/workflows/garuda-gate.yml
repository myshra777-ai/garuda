name: Garuda Architectural & Financial PR Gate

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast Drop-In PR Diff Gate (~30 lines — copy into any repo!)
  #    Downloads or builds garuda, checks PR diff, comments on PR, fails on BLOCK
  # ---------------------------------------------------------------------------
  garuda-pr-gate:
    name: Garuda Diff-Scoped PR Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Full History for Diff Scope)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install or Build Garuda Binary
        run: |
          if [ -f "cmd/garuda/main.go" ]; then
            CGO_ENABLED=0 go build -o /usr/local/bin/garuda ./cmd/garuda
          else
            LATEST_URL="https://github.com/myshra777-ai/garuda/releases/latest/download/garuda-linux-amd64"
            curl -fsSL "$LATEST_URL" -o /usr/local/bin/garuda && chmod +x /usr/local/bin/garuda
          fi
          garuda --version

      - name: Seed Starter Policy Templates (if policies/ is empty)
        run: |
          if [ ! -d "policies" ] || [ -z "$(ls -A policies/*.yaml 2>/dev/null)" ]; then
            garuda templates install financial
          fi

      - name: Run Garuda Check Against PR Diff
        id: garuda_check
        continue-on-error: true
        run: |
          DIFF_RANGE="HEAD~1..HEAD"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF_RANGE="origin/${{ github.base_ref }}...HEAD"
          fi
          garuda check . \
            --diff "$DIFF_RANGE" \
            --policy policies \
            --pr-comment garuda-pr-report.md \
            --sarif garuda.sarif \
            --fail-on-block || echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post Garuda Governance Verdict Comment on PR
        if: github.event_name == 'pull_request' && hashFiles('garuda-pr-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('garuda-pr-report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Enforce Fail-Closed Gate on CRITICAL Violations
        if: steps.garuda_check.outputs.exit_code != ''
        run: |
          echo "❌ Garuda blocked this PR due to CRITICAL architectural or financial policy violations."
          exit 2

  # ---------------------------------------------------------------------------
  # 2. Full Postgres + Merkle Ledger Verification Suite
  # ---------------------------------------------------------------------------
  verify-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: garuda
          POSTGRES_PASSWORD: garudapassword
          POSTGRES_DB: garuda
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://garuda:garudapassword@localhost:5432/garuda?sslmode=disable
      GARUDA_TENANT_ID: "00000000-0000-0000-0000-000000000001"
      GARUDA_WORKSPACE: "ci-workspace"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U garuda -d garuda; then
              echo "✅ Postgres ready"
              break
            fi
            sleep 1
          done

      - name: Run All Database Migrations
        run: go run cmd/migrate/main.go

      - name: Build Garuda Engine CLI & Run Demo Smoke Check
        run: |
          CGO_ENABLED=0 go build -o bin/garuda ./cmd/garuda
          ./bin/garuda demo
          ./bin/garuda analyze . --save --workspace ci-workspace
          ./bin/garuda ci check --fail-on-contradiction=true