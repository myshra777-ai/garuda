# .github/workflows/garuda-ci.yml

name: Garuda CI

on:
  pull_request:
    branches: [ main, mvp-refactor ]
  push:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  garuda-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Garuda
        run: go build -o garuda cmd/garuda/*.go

      - name: Create baseline from main branch (using git worktree)
        run: |
          # Create a temporary worktree for the baseline
          git worktree add /tmp/garuda-baseline origin/main
          cd /tmp/garuda-baseline
          # Run analysis on the clean baseline
          ../garuda analyze . -o ../garuda-baseline.json
          cd -
          git worktree remove /tmp/garuda-baseline

      - name: Run Garuda CI (capture exit code)
        id: garuda_ci
        continue-on-error: true
        run: |
          ./garuda ci --baseline garuda-baseline.json --block-on-break --output ci-report.json
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Post comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- garuda-ci-comment-marker -->';
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('ci-report.json', 'utf8'));
            } catch (e) {
              report = { summary: { breaking_changes: 0, warnings: 0, additions: 0, removals: 0, modified: 0 } };
            }
            const summary = report.summary || {};
            let body = `## 🧠 Garuda CI Report\n\n`;
            body += `**Status:** ${report.status || 'OK'}\n`;
            body += `**Breaking:** ${summary.breaking_changes || 0}\n`;
            body += `**Warnings:** ${summary.warnings || 0}\n`;
            body += `**Additions:** ${summary.additions || 0}\n`;
            body += `**Removals:** ${summary.removals || 0}\n`;
            body += `**Modified:** ${summary.modified || 0}\n`;

            const entityDiffs = report.entity_diffs || [];
            if (entityDiffs.length > 0) {
              body += `\n### Entity Changes\n`;
              entityDiffs.forEach(ed => {
                body += `- ${ed.status} ${ed.kind} ${ed.name}\n`;
              });
            }
            const relDiffs = report.relationship_diffs || [];
            if (relDiffs.length > 0) {
              body += `\n### Relationship Changes\n`;
              relDiffs.forEach(rd => {
                body += `- ${rd.status} ${rd.type} ${rd.from} -> ${rd.to}\n`;
              });
            }
            body += `\n<details><summary>Full report (JSON)</summary>\n\`\`\`json\n${JSON.stringify(report, null, 2)}\n\`\`\`\n</details>\n`;
            body += marker;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.body.includes(marker));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job if breaking changes detected
        if: steps.garuda_ci.outputs.exit_code != '0' && github.event_name == 'pull_request'
        run: |
          echo "❌ Breaking changes detected – PR blocked."
          exit 1