name: Release (draft GitHub release with binaries, checksums and notes)

# Push a version tag to build every platform archive and create a DRAFT release.
# Review the draft on the Releases page, then press "Publish release".
#
#   git tag v1.9.11 && git push origin v1.9.10
#
# Publishing the release also triggers publish-mcp-registry.yml. The container images
# are built by release-packages.yml and publish-mcp-image.yml from the same tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to build and draft a release for (for example v1.9.11)"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  verify:
    name: Verify docs, manifests and tests for the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match version.txt and capabilities.json
        run: |
          want="$(tr -d '[:space:]' < version.txt)"
          if [ "$want" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version.txt ($want). Run: python3 scripts/sync_docs_from_manifest.py --set $TAG --date YYYY-MM-DD, commit, then re-tag."
            exit 1
          fi
      - name: Release facts and documentation are consistent
        run: |
          python3 scripts/sync_docs_from_manifest.py --check
          python3 scripts/check_doc_links.py
      - name: Release notes exist
        run: grep -q "${TAG#v}" RELEASE_NOTES.md || { echo "::error::RELEASE_NOTES.md does not mention ${TAG#v}"; exit 1; }
      - name: Build, vet and test
        run: |
          go build ./...
          go vet ./...
          go test -count=1 ./cmd/garuda ./cmd/garuda-api ./internal/api ./internal/policy ./internal/store

  build:
    name: Build all platform archives
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release matrix (static, CGO_ENABLED=0)
        env:
          GARUDA_VERSION: ${{ env.TAG }}
        run: |
          chmod +x scripts/build_release_matrix.sh
          ./scripts/build_release_matrix.sh dist/releases
          ls -lh dist/releases
      - name: Fill checksums into the package-manager manifests
        run: python3 scripts/render_packaging.py --sums dist/releases/SHA256SUMS.txt --out dist/releases/packaging
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/releases/*.tar.gz
            dist/releases/*.zip
            dist/releases/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: garuda-release-${{ env.TAG }}
          path: dist/releases
          if-no-files-found: error

  release:
    name: Create the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: garuda-release-${{ env.TAG }}
          path: dist/releases
      - name: Create or update the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: "Garuda ${{ env.TAG }}"
          body_path: RELEASE_NOTES.md
          draft: ${{ github.event_name == 'push' || inputs.draft }}
          prerelease: ${{ contains(env.TAG, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/releases/*.zip
            dist/releases/*.tar.gz
            dist/releases/*.deb
            dist/releases/SHA256SUMS.txt
            dist/releases/install.sh
            dist/releases/install.ps1
            dist/releases/setup.sh
            dist/releases/setup.ps1
            dist/releases/packaging/**
