name: Release Multi-OS Standalone Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-matrix:
    name: Build Standalone Multi-OS Bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build Windows, macOS, Linux, Chromebook & Android Matrix (CGO_ENABLED=0)
        run: |
          chmod +x scripts/build_release_matrix.sh
          ./scripts/build_release_matrix.sh dist

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garuda-universal-binaries
          path: dist/*