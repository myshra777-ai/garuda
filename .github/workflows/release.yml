name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Multi-Platform Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/garuda-linux-amd64 ./cmd/garuda
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/garuda-linux-arm64 ./cmd/garuda
          # macOS AMD64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/garuda-darwin-amd64 ./cmd/garuda
          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/garuda-darwin-arm64 ./cmd/garuda
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.Version=${TAG_NAME}" -o dist/garuda-windows-amd64.exe ./cmd/garuda

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Garuda ${{ github.ref_name }} - Canonical Semantic Core & Infrastructure Hardening"
          body_path: CHANGELOG.md
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}