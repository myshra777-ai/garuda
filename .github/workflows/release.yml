name: Release Multi-OS Standalone Binaries & Packages (v1.9.1)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. v1.9.1)"
        required: false
        default: "v1.9.1"

permissions:
  contents: write

jobs:
  release-matrix:
    name: Build & Publish All-OS Standalone Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go 1.26.0
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Build Windows, macOS, Linux (.tar.gz + .deb), Chromebook, Android & FreeBSD Matrix (CGO_ENABLED=0)
        env:
          GARUDA_VERSION: ${{ github.ref_name != 'main' && github.ref_name || inputs.tag_name || 'v1.9.1' }}
        run: |
          chmod +x scripts/build_release_matrix.sh
          ./scripts/build_release_matrix.sh dist
          ls -lh dist/

      - name: Upload Multi-OS Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garuda-v1.9.1-universal-packages
          path: |
            dist/*
            packaging/**/*

      - name: Publish GitHub Release with RELEASE_NOTES.md & All OS Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.9.1' }}
          name: "Garuda ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.9.1' }} — 35-Tool MCP, Financial & Logic Audit, Base Rulebook & All-OS Packages"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/SHA256SUMS.txt
            dist/install.sh
            dist/install.ps1
            dist/setup.sh
            dist/setup.ps1
            RELEASE_NOTES.md
