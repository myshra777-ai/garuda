name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build multi-platform binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          TAG_NAME="${{ github.ref_name }}"
          LDFLAGS="-s -w -X main.Version=${TAG_NAME}"

          GOOS=linux   GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/garuda-linux-amd64       ./cmd/garuda
          GOOS=linux   GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/garuda-linux-arm64       ./cmd/garuda
          GOOS=darwin  GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/garuda-darwin-amd64      ./cmd/garuda
          GOOS=darwin  GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/garuda-darwin-arm64      ./cmd/garuda
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/garuda-windows-amd64.exe ./cmd/garuda

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Garuda ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}