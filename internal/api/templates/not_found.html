<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workspace not found — Garuda</title>
<style>
body { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #F7F7F3; color: #191B19; margin: 0; padding: 60px 40px; }
.card { max-width: 540px; margin: 60px auto; background: #FFFFFF; border: 1px solid #E7E7E1; border-radius: 12px; padding: 32px; box-shadow: 0 4px 16px rgba(25,27,25,0.05); }
h1 { font-size: 20px; font-weight: 650; margin: 0 0 10px; letter-spacing: -0.02em; }
p { color: #4A4D48; line-height: 1.5; margin: 8px 0; font-size: 13.5px; }
code { background: #F0F0EA; border: 1px solid #E7E7E1; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
a { display: inline-block; background: #191B19; color: #FFFFFF; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 12.5px; }
a:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="card">
  <h1>Workspace not found</h1>
  <p>The workspace <code>{{ .Workspace }}</code> does not exist or is not accessible in this tenant.</p>
  <p>Garuda fails closed with HTTP 404 rather than silently serving another workspace's architectural index.</p>
  <p style="margin-top: 20px;"><a href="/dashboard">Return to default workspace →</a></p>
</div>
</body>
</html>
