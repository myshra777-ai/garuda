services:
  postgres:
    image: postgres:16-alpine
    container_name: garuda-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: garuda_test
    ports:
      - "5433:5432"
    volumes:
      - garuda-pgdata:/var/lib/postgresql/data
volumes:
  garuda-pgdata:
