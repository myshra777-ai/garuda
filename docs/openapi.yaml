openapi: 3.0.3
info:
  title: Garuda HTTP API — current route inventory
  version: 1.5.0
  description: |
    Current route inventory aligned to internal/api/handler.go in the v1.5.0
    codebase. Detailed request/response schemas remain handler-specific where
    no stable typed public schema is defined. See docs/API.md for workflows,
    auth boundaries, configuration and operational limitations.
servers:
  - url: http://localhost:8080
    description: Local Garuda API gateway
paths:
  /health:
    get:
      summary: Liveness check
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /healthz:
    get:
      summary: Liveness alias
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /readyz:
    get:
      summary: Database readiness
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        '503': { $ref: '#/components/responses/JSONError' }
  /api/v1/system/health:
    get:
      summary: Readiness check for the API namespace
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        '503': { $ref: '#/components/responses/JSONError' }
  /favicon.ico:
    get:
      summary: Favicon response
      security: []
      responses:
        '204': { description: No content }
  /login:
    get:
      summary: Render browser login form
      security: []
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
    post:
      summary: Authenticate a browser user
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Login result or redirect; see handler behavior }
        '303': { description: Redirect after successful login }
        '401': { $ref: '#/components/responses/JSONError' }
  /signup:
    get:
      summary: Render browser signup form
      security: []
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
    post:
      summary: Signup and workspace provisioning
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: true }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        '400': { $ref: '#/components/responses/JSONError' }
  /logout:
    post:
      summary: End tenant browser session
      security:
        - TenantSession: []
      responses:
        '200': { description: Logout result or redirect }
        '303': { description: Redirect after logout }
  /dashboard:
    get:
      summary: Tenant Workspace Console
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
        '303': { description: Redirect to login when unauthenticated }
  /api/v1/dashboard/stats:
    get:
      summary: Workspace dashboard stats
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/search:
    get:
      summary: Search workspace index
      security:
        - TenantSession: []
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/sessions:
    get:
      summary: Dashboard session view data
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/decisions:
    get:
      summary: List dashboard decisions
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/decisions/{id}:
    get:
      summary: Read dashboard decision detail
      security:
        - TenantSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/policies:
    get:
      summary: Read dashboard policy view
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/dashboard/policies/verify:
    get:
      summary: Verify dashboard policy evidence
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/graph:
    get:
      summary: Read architecture graph
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /api/v1/events:
    get:
      summary: Workspace live event stream
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
  /api/v1/workspaces:
    get:
      summary: List available workspaces
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /system/discover:
    get:
      summary: Discover system modules and endpoint groups
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
  /admin:
    get:
      summary: Legacy deployment-admin dashboard
      description: Requires a tenant session and the GARUDA_ADMIN_EMAILS allowlist; returns 404 when disabled.
      security:
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
        '404': { description: Admin dashboard disabled or caller not allowlisted }
  /api/v1/decisions/propose:
    post:
      summary: Propose a scoped governance decision
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/evidence/verify/{id}:
    get:
      summary: Verify decision evidence
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/agent/warmup:
    get:
      summary: Agent context warmup
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/agents/checkpoint:
    post:
      summary: Persist agent checkpoint
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/agents/handoff:
    post:
      summary: Handoff task ownership
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/agents/resume:
    post:
      summary: Resume agent from checkpoint
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/tasks/{task_id}/lineage:
    get:
      summary: Read task lineage
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/router/evaluate:
    post:
      summary: Evaluate a routing request
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/telemetry/stream:
    get:
      summary: Stream telemetry events
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/EventStream' }
  /api/v1/telemetry/spans:
    post:
      summary: Ingest OpenTelemetry spans
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/runtime/spans:
    post:
      summary: Runtime telemetry ingestion alias
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/runtime/coverage:
    get:
      summary: Read runtime evidence coverage
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /api/v1/merkle/state:
    get:
      summary: Read current Merkle root and block state
      security:
        - TenantBearer: []
        - GarudaTokenHeader: []
        - TenantSession: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        default: { $ref: '#/components/responses/JSONError' }
  /_/control/login:
    get:
      summary: Render owner Control Plane token login form
      security: []
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
        '404': { description: Control Plane token is not configured }
    post:
      summary: Authenticate owner Control Plane token
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '303': { description: Redirect after successful login }
        '200': { $ref: '#/components/responses/HTMLSuccess' }
        '404': { description: Control Plane token is not configured }
  /_/control/logout:
    post:
      summary: Clear owner Control Plane cookie
      security:
        - OwnerCookie: []
        - OwnerToken: []
      responses:
        '303': { description: Redirect after logout }
  /_/control:
    get:
      summary: Owner Control Plane
      description: Requires GARUDA_CONTROL_TOKEN and CONTROL_DATABASE_URL. Disabled or unauthenticated routes return 404.
      security:
        - OwnerCookie: []
        - OwnerToken: []
      parameters:
        - name: tab
          in: query
          required: false
          schema: { type: string, enum: [business, tenants, operations, internal] }
      responses:
        '200': { $ref: '#/components/responses/HTMLSuccess' }
        '404': { description: Control Plane disabled or authentication failed }
  /debug/token:
    get:
      summary: Development debug-token helper
      description: Returns 404 when GARUDA_ENV=production.
      security: []
      responses:
        '200': { $ref: '#/components/responses/JSONSuccess' }
        '404': { description: Disabled in production }
components:
  securitySchemes:
    TenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Tenant-scoped Ed25519 JWT accepted by AuthMiddleware.
    GarudaTokenHeader:
      type: apiKey
      in: header
      name: X-Garuda-Token
      description: Alternative token header accepted by AuthMiddleware.
    TenantSession:
      type: apiKey
      in: cookie
      name: garuda_session
    OwnerToken:
      type: http
      scheme: bearer
      description: Must match GARUDA_CONTROL_TOKEN.
    OwnerCookie:
      type: apiKey
      in: cookie
      name: garuda_control_session
  responses:
    JSONSuccess:
      description: Successful response; payload schema is handler-specific.
      content:
        application/json:
          schema:
            oneOf:
              - type: object
                additionalProperties: true
              - type: array
                items: {}
              - type: string
    JSONError:
      description: Error response; exact fields depend on the handler.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    HTMLSuccess:
      description: HTML response
      content:
        text/html:
          schema: { type: string }
    EventStream:
      description: Server-sent event stream
      content:
        text/event-stream:
          schema: { type: string }
