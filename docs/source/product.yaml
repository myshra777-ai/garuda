schema_version: "1.0"
product:
  name: "garuda"
  display_name: "Garuda"
  tagline: "Let agents write code. Keep architecture in the loop."
  category:
    primary: "Architecture-aware change control for AI-written software"
    secondary:
      - "Active AI-agent execution harness"
      - "Software architecture intelligence"
      - "Policy-based CI change control"
      - "Evidence-backed software governance"
  short_description: "Garuda maps supported code relationships, gives coding agents pre-edit context, checks edits against explicit architecture policies, and records selected governance decisions for verification."
  long_description: >-
    Garuda connects a semantic model of supported code, graph-visible change
    impact, documented architecture claims, configured YAML policies, ingested
    runtime observations, agent workflow integrations, CI gate outcomes, and
    cryptographic verification for persisted governance records. Garuda Talon
    brings pre-edit briefing, post-edit checks, repair-oriented feedback and a
    bounded CLI-agent supervisor loop to supported integrations.
  thesis: >-
    A code graph is useful to explore. It becomes more valuable when it guides
    an agent before an edit, checks the edit against explicit constraints, and
    produces a reviewable result that can fail a configured gate.
  immediate_mission: >-
    Help teams that use AI coding agents catch architecture-policy violations
    and unexpected change impact before code merges.
  audiences:
    primary:
      - "Engineering teams using AI coding agents on non-trivial codebases"
      - "Platform and developer productivity teams"
      - "Staff/principal engineers responsible for architecture boundaries"
    secondary:
      - "CTOs and VPs of Engineering"
      - "Teams operating multi-repository software workspaces"
      - "Security and governance stakeholders reviewing recorded change decisions"
  positioning:
    problem: "AI-generated diffs can pass tests while breaking dependency rules, introducing cycles, contradicting ADRs, or affecting more code than the diff reveals."
    solution: "Build an indexed semantic model, provide agent-aware context, evaluate selected changes against explicit policies, and expose evidence-backed outcomes through CLI, MCP, dashboard and CI paths."
    differentiation:
      - "Diff-to-symbol mapping and graph-visible blast-radius estimates"
      - "Nine supported YAML policy predicate types"
      - "Talon pre-edit briefing, post-edit guard, repair feedback and bounded CLI-agent supervision"
      - "MCP tools plus prompt/resources and configured active contract injection"
      - "Correlation of indexed structure, documented claims and ingested runtime telemetry"
      - "Merkle integrity and inclusion verification for persisted governance records"
