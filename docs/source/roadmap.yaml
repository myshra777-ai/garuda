schema_version: "1.0"
roadmap:
  current_phase: "P4"
  next_phase: "P5"
  current_phase_status: "active"

  strategic_sequence:
    - "Analyze supported source code into a scoped semantic model"
    - "Map a Git diff to touched symbols and graph-visible blast radius"
    - "Give agents pre-edit context from policies, ADRs and high-impact symbols"
    - "Re-index edits and check net-new violations after editing"
    - "Fail a configured CI job when a blocking policy outcome is returned"
    - "Correlate available documentation claims and runtime observations"
    - "Persist selected governance decisions and verify their Merkle inclusion"
    - "Improve freshness, failure-path coverage, language resolution and deployment safety"

  phases:
    P0:
      name: "Trust and Data Foundations"
      status: "complete"
    P1:
      name: "Semantic Model and Workspace Graph"
      status: "complete"
    P2:
      name: "Supported Language Analysis"
      status: "implemented-with-ongoing-validation"
    P3:
      name: "Policy and Diff-Scoped Change Control"
      status: "implemented"
    P4:
      name: "Talon Active Agent Harness"
      status: "active"
    P5:
      name: "Reliability, Freshness and CI Enforcement Hardening"
      status: "next"
    P6:
      name: "Resolution Quality and Language Coverage"
      status: "planned"
    P7:
      name: "Team Deployment and Operational Readiness"
      status: "planned"

  deferred:
    - "Universal dynamic call-graph discovery"
    - "Universal enforcement across every AI agent and editor"
    - "Sandbox escape prevention or arbitrary untrusted-code execution"
    - "Automatic merge authorization without a separate team-controlled gate"
    - "Every programming language or complete compiler-grade resolution everywhere"
    - "Compliance certification or proof that software is bug-free"
    - "Persistent Hygiene finding lifecycle, suppression and baseline management"

  strategic_moats:
    - name: "Semantic code model tied to change scope"
      status: "active"
    - name: "Diff-scoped policy checks with net-new versus baseline reporting"
      status: "active"
    - name: "Talon pre-edit and post-edit agent workflow"
      status: "active"
    - name: "Correlated static, documentation and runtime evidence"
      status: "implemented-with-coverage-boundaries"
    - name: "Verifiable records for persisted governance decisions"
      status: "active"
