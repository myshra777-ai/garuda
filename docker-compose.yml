# Garuda API + PostgreSQL for local evaluation.
#
#   POSTGRES_PASSWORD='choose-one' docker compose up -d --build
#
# Both ports are published on 127.0.0.1 only. For anything that is not a laptop
# demo, use deploy/compose/docker-compose.prod.yml or deploy/k8s/garuda-stack.yaml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: garuda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garuda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD before starting}
      POSTGRES_DB: garuda
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - garuda-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garuda -d garuda"]
      interval: 3s
      timeout: 3s
      retries: 5

  garuda-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/myshra777-ai/garuda:latest
    container_name: garuda-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://garuda:${POSTGRES_PASSWORD}@postgres:5432/garuda?sslmode=disable
      PORT: "8080"
      GARUDA_ENV: development
      # Optional: set both to keep sessions valid across restarts (Ed25519 keys, hex).
      # When unset in development, the API generates temporary keys on every start.
      JWT_PRIVATE_KEY_HEX: ${JWT_PRIVATE_KEY_HEX:-}
      JWT_PUBLIC_KEY_HEX: ${JWT_PUBLIC_KEY_HEX:-}
    volumes:
      - ./migrations:/migrations:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - garuda-net

volumes:
  pgdata:

networks:
  garuda-net:
    driver: bridge
