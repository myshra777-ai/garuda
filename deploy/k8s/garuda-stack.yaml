apiVersion: v1
kind: Namespace
metadata:
  name: garuda-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garuda-api
  namespace: garuda-system
  labels:
    app: garuda-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: garuda-api
  template:
    metadata:
      labels:
        app: garuda-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: garuda-api
        image: ghcr.io/myshra777-ai/garuda-api:v1.3.0
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: GARUDA_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: garuda-secrets
              key: database-url
        - name: JWT_PRIVATE_KEY_HEX
          valueFrom:
            secretKeyRef:
              name: garuda-secrets
              key: jwt-private-key-hex
        - name: JWT_PUBLIC_KEY_HEX
          valueFrom:
            secretKeyRef:
              name: garuda-secrets
              key: jwt-public-key-hex
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: garuda-secrets
              key: redis-url
              optional: true
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2000m"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: garuda-api-svc
  namespace: garuda-system
spec:
  selector:
    app: garuda-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: garuda-api-hpa
  namespace: garuda-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: garuda-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: garuda-api-netpol
  namespace: garuda-system
spec:
  podSelector:
    matchLabels:
      app: garuda-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  - ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 4317
    - protocol: UDP
      port: 53