
services:
  # ------------------------------
  # PostgreSQL Engine
  # ------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: garuda-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: garuda
      POSTGRES_PASSWORD: garudapassword
      POSTGRES_DB: garuda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garuda"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # ------------------------------
  # Redis Cache & Bus
  # ------------------------------
  redis:
    image: redis:7-alpine
    container_name: garuda-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------
  # Telemetry Collector
  # ------------------------------
  telemetry-collector:
    build:
      context: ../../
      dockerfile: build/Dockerfile.collector
    image: garuda/telemetry-collector:latest
    container_name: garuda-telemetry-collector
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://garuda:garudapassword@garuda-postgres-prod:5432/garuda?sslmode=disable}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      TELEMETRY_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ------------------------------
  # Garuda API Gateway
  # ------------------------------
  garuda-api:
    build:
      context: ../../
      dockerfile: build/Dockerfile.api
    image: garuda/garuda-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garuda:garudapassword@garuda-postgres-prod:5432/garuda?sslmode=disable
      REDIS_ADDR: redis:6379
      GARUDA_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GARUDA_TELEMETRY_ENABLED: "true"
      GARUDA_TELEMETRY_ENDPOINT: "http://garuda-telemetry-collector:8081/v1/telemetry"
      GARUDA_TELEMETRY_BATCH_SIZE: "10"
      GARUDA_TELEMETRY_FLUSH_INTERVAL: "5s"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      telemetry-collector:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ------------------------------
  # Garuda Background Worker
  # ------------------------------
  garuda-worker:
    build:
      context: ../../
      dockerfile: build/Dockerfile.worker
    image: garuda/garuda-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garuda:garudapassword@garuda-postgres-prod:5432/garuda?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local