version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: garuda-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-garuda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in production}
      POSTGRES_DB: ${POSTGRES_DB:-garuda_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../migrations:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-garuda} -d ${POSTGRES_DB:-garuda_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garuda-net

  redis:
    image: redis:7-alpine
    container_name: garuda-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in production}"]
    volumes:
      - redisdata:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garuda-net

  garuda-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: garuda-api-prod
    restart: always
    ports:
      - "${GARUDA_BIND_HOST:-127.0.0.1}:8080:8080"
    environment:
      GARUDA_ENV: "production"
      PORT: "8080"
      DATABASE_URL: "postgres://${POSTGRES_USER:-garuda}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-garuda_db}?sslmode=disable"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      JWT_PRIVATE_KEY_HEX: ${JWT_PRIVATE_KEY_HEX:?JWT_PRIVATE_KEY_HEX must be set in production}
      JWT_PUBLIC_KEY_HEX: ${JWT_PUBLIC_KEY_HEX:?JWT_PUBLIC_KEY_HEX must be set in production}
      GARUDA_RATE_LIMIT_RPS: ${GARUDA_RATE_LIMIT_RPS:-100}
      GARUDA_RATE_LIMIT_BURST: ${GARUDA_RATE_LIMIT_BURST:-200}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garuda-net

volumes:
  pgdata:
  redisdata:

networks:
  garuda-net:
    driver: bridge
    internal: false