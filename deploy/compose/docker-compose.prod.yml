services:
  postgres:
    image: postgres:16-alpine
    container_name: garuda-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: garuda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-garudapassword}
      POSTGRES_DB: garuda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garuda -d garuda"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: garuda-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  telemetry-collector:
    build:
      context: .
      dockerfile: build/Dockerfile.collector
    image: garuda/telemetry-collector:latest
    container_name: garuda-telemetry-collector
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garuda:${POSTGRES_PASSWORD:-garudapassword}@postgres:5432/garuda?sslmode=disable
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      TELEMETRY_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  garuda-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: garuda/garuda-api:v1.0.0
    container_name: garuda-api-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garuda:${POSTGRES_PASSWORD:-garudapassword}@postgres:5432/garuda?sslmode=disable
      REDIS_ADDR: redis:6379
      GARUDA_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GARUDA_TELEMETRY_ENABLED: "true"
      GARUDA_TELEMETRY_ENDPOINT: "http://telemetry-collector:8081/v1/telemetry"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  garuda-worker:
    build:
      context: .
      dockerfile: build/Dockerfile.worker
    image: garuda/garuda-worker:latest
    container_name: garuda-worker-prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://garuda:${POSTGRES_PASSWORD:-garudapassword}@postgres:5432/garuda?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: