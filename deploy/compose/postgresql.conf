# ====================================================================
# Garuda Production PostgreSQL Engine Configuration
# Target Hardware: 4 vCPU, 8GB+ RAM, NVMe/SSD Storage
# ====================================================================

# --------------------------------------------------------------------
# 1. Connection Settings
# --------------------------------------------------------------------
max_connections = 500
superuser_reserved_connections = 3

# --------------------------------------------------------------------
# 2. Memory Allocation
# --------------------------------------------------------------------
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 4GB

# --------------------------------------------------------------------
# 3. Write-Ahead Log (WAL) & Checkpoint Tuning
# --------------------------------------------------------------------
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --------------------------------------------------------------------
# 4. Query Planner & Parallel Execution Tuning
# --------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
# parallel_workers = 8
max_parallel_workers_per_gather = 4

# --------------------------------------------------------------------
# 5. Logging & Diagnostics
# --------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 5000  # Log slow queries taking > 5000ms (5s)